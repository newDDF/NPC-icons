<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC-icons 图标库</title>
    <style>
        :root[data-theme="light"] {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-color: #1c1c1e;
            --text-muted: #8e8e93;
            --border-color: rgba(60, 60, 67, 0.1);
            --accent-color: #007aff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            --blur-bg: rgba(255, 255, 255, 0.7);
        }
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.8);
            --text-color: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: rgba(242, 242, 247, 0.15);
            --accent-color: #0a84ff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --blur-bg: rgba(28, 28, 30, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
        header { text-align: center; padding: 50px 20px 20px 20px; font-size: 2.8rem; font-weight: 700; letter-spacing: -0.5px; }

        .toolbar { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 15px; align-items: center; position: relative; }
        .sidebar-toggle { background: var(--card-bg); border: 1px solid var(--border-color); padding: 12px 18px; border-radius: 12px; cursor: pointer; color: var(--text-color); font-weight: 600; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
        
        .sidebar { position: absolute; top: 55px; left: 20px; background: var(--blur-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; display: none; flex-direction: column; gap: 15px; z-index: 100; box-shadow: var(--shadow); min-width: 220px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        .sidebar.active { display: flex; }
        .menu-item { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 500; }
        .menu-item select, .menu-item button { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.1); color: var(--text-color); cursor: pointer; font-size: 0.85rem; }

        .search-box { flex: 1; }
        .search-box input { width: 100%; padding: 14px 20px; border-radius: 14px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 1rem; outline: none; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
        .search-box input:focus { border-color: var(--accent-color); }

        .main-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; }
        
        .icon-grid.dense { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
        .icon-grid.dense .icon-card { padding: 12px; border-radius: 14px; }
        .icon-grid.dense .icon-wrapper { width: 40px; height: 40px; }
        .icon-grid.dense .card-actions { margin-top: 4px; gap: 8px; }

        .icon-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; box-shadow: var(--shadow); position: relative; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s; }
        .icon-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        
        .format-badge { position: absolute; top: 10px; right: 12px; font-size: 0.65rem; opacity: 0.4; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        .icon-wrapper { width: 56px; height: 56px; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 12px; transition: background-color 0.2s; }
        .icon-wrapper:hover { background: rgba(0, 0, 0, 0.05); }
        [data-theme="dark"] .icon-wrapper:hover { background: rgba(255, 255, 255, 0.08); }
        .icon-wrapper svg { width: 100%; height: 100%; fill: currentColor; }
        
        .icon-name { font-weight: 600; font-size: 0.95rem; text-align: center; word-break: break-all; margin-top: 4px; }
        .icon-color { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; padding: 3px 8px; border-radius: 6px; background: rgba(0,0,0,0.03); font-family: monospace; }
        [data-theme="dark"] .icon-color { background: rgba(255,255,255,0.05); }
        .icon-color:hover { color: var(--accent-color); }

        .card-actions { display: flex; gap: 14px; width: 100%; justify-content: center; margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 8px; transition: color 0.2s, background-color 0.2s; }
        .action-btn:hover { color: var(--accent-color); background: rgba(0, 74, 255, 0.08); }
        .action-btn svg { width: 18px; height: 18px; fill: currentColor; }

        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        
        .modal-content { background: var(--blur-bg); border: 1px solid var(--border-color); width: 90%; max-width: 420px; border-radius: 28px; padding: 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); transform: scale(0.85) translateY(20px); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; flex-direction: column; align-items: center; gap: 20px; position: relative; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        
        .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.05); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--text-color); font-weight: bold; display: flex; align-items: center; justify-content: center; }
        [data-theme="dark"] .modal-close { background: rgba(255,255,255,0.1); }
        .modal-preview { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .modal-preview svg { width: 100%; height: 100%; fill: currentColor; }
        
        .load-more-container { text-align: center; margin: 50px 0; }
        .load-more-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 14px 40px; border-radius: 25px; cursor: pointer; color: var(--text-color); font-size: 0.95rem; font-weight: 600; box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }
        .load-more-btn:hover { transform: scale(1.02); }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 14px; font-size: 0.9rem; font-weight: 500; z-index: 2000; opacity: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        [data-theme="dark"] .toast { background: rgba(255,255,255,0.9); color: #000; }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        
        footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; border-top: 1px solid var(--border-color); margin-top: 60px; }
    </style>
</head>

<body>

    <header>NPC-icons</header>

    <div class="toolbar">
        <button class="sidebar-toggle" id="toggleMenu">☰ 功能</button>
        <div class="sidebar" id="sidebarMenu">
            <div class="menu-item"><label>1. 图标排序</label><select id="sortSelect"><option value="asc">名称升序 (A-Z)</option><option value="desc">名称降序 (Z-A)</option></select></div>
            <div class="menu-item"><label>2. 主题模式</label><button id="themeBtn">切换到黑夜模式</button></div>
            <div class="menu-item"><label>3. 格式筛选</label><select id="formatSelect"><option value="all">全部格式 (SVG/PNG)</option><option value="svg">仅 SVG</option><option value="png">仅 PNG</option></select></div>
            <div class="menu-item"><label>4. 显示密度</label><select id="densitySelect"><option value="normal">舒适</option><option value="dense">紧凑</option></select></div>
        </div>
        <div class="search-box"><input type="text" id="searchInput" placeholder="搜索图标..."></div>
    </div>

    <main class="main-container">
        <div class="icon-grid" id="iconGrid"></div>
        <div class="load-more-container"><button class="load-more-btn" id="loadMoreBtn">显示更多</button></div>
    </main>

    <!-- 苹果风详情模态弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">✕</button>
            <div class="modal-preview" id="modalPreview"></div>
            <h3 id="modalName" style="font-size: 1.3rem; font-weight: 700;"></h3>
            <p id="modalInfo" style="font-size: 0.9rem; color: var(--text-muted); text-align: center; line-height: 1.5;"></p>
        </div>
    </div>

    <div class="toast" id="toast">复制成功！</div>
    <footer>Copyright@NPC2026</footer>


    <script>
        // 👇 自动化脚本会自动重写此区域的数据，请勿删除或修改两行占位符注释
        /*[[BUILD_INSERT_ICONS]]*/
const MOCK_ICONS = [
  {
    "name": "test",
    "color": "#FF5722",
    "format": "svg",
    "code": "<svg xmlns=\"http://w3.org\" viewBox=\"0 0 100 100\"><rect width=\"100\" height=\"100\" fill=\"currentColor\"/></svg>"
  },
  {
    "name": "amd",
    "color": "#198754",
    "format": "svg",
    "code": "<svg role=\"img\" viewBox=\"0 0 24 24\" xmlns=\"http://www.w3.org/2000/svg\"><title>AMD</title><path d=\"M18.324 9.137l1.559 1.56h2.556v2.557L24 14.814V9.137zM2 9.52l-2 4.96h1.309l.37-.982H3.9l.408.982h1.338L3.432 9.52zm4.209 0v4.955h1.238v-3.092l1.338 1.562h.188l1.338-1.556v3.091h1.238V9.52H10.47l-1.592 1.845L7.287 9.52zm6.283 0v4.96h2.057c1.979 0 2.88-1.046 2.88-2.472 0-1.36-.937-2.488-2.747-2.488zm1.237.91h.792c1.17 0 1.63.711 1.63 1.57 0 .728-.372 1.572-1.616 1.572h-.806zm-10.985.273l.791 1.932H2.008zm17.137.307l-1.604 1.603v2.25h2.246l1.604-1.607h-2.246z\"/></svg>"
  },
  {
    "name": "my_logo",
    "color": "#ffffff",
    "format": "svg",
    "code": "<?xml version=\"1.0\" encoding=\"UTF-8\"?><svg id=\"_图层_1\" data-name=\"图层 1\" xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 120 120\"><defs><style>      .cls-1, .cls-2 {        stroke-width: 0px;      }      .cls-2 {        fill: #fff;      }    </style></defs><rect class=\"cls-1\" x=\"-.26\" y=\"-.73\" width=\"120\" height=\"120\" rx=\"30.16\" ry=\"30.16\"/><g><polygon class=\"cls-2\" points=\"49.26 75.82 34.04 84.6 34.04 74.38 20.83 92.11 34.49 100 51.33 90.28 62.29 36.46 49.26 53.95 49.26 75.82\"/><polygon class=\"cls-2\" points=\"89.16 78.03 89.16 85.41 77.67 78.81 77.67 62.68 67.96 49.72 67.96 84.38 98.26 90.18 95.21 86.11 89.16 78.03\"/><polygon class=\"cls-2\" points=\"89.16 47.55 89.16 76.53 95.99 85.66 98.5 89.01 88.39 36.74 68.17 48.51 77.67 61.18 77.67 54.24 89.16 47.55\"/><polygon class=\"cls-2\" points=\"98.04 91.05 70.05 85.69 88.71 96.41 98.04 91.05\"/><polygon class=\"cls-2\" points=\"98.86 86.17 98.86 42.39 96.37 40.96 89.34 36.91 98.86 86.17\"/><polygon class=\"cls-2\" points=\"20.61 87.56 33.86 18.71 20.61 26.36 20.61 87.56\"/><polygon class=\"cls-2\" points=\"34.04 72.88 34.04 33.74 49.26 42.64 49.26 52.46 55.17 44.52 62.47 34.72 34.81 18.54 20.97 90.42 34.04 72.88\"/><polygon class=\"cls-2\" points=\"62.68 39.03 52.38 89.62 62.68 83.64 62.68 39.03\"/></g></svg>"
  }
];
/*[[BUILD_INSERT_END]]*/

        let displayLimit = 12;
        const iconGrid = document.getElementById('iconGrid');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const toggleMenuBtn = document.getElementById('toggleMenu');
        const toast = document.getElementById('toast');
        const themeBtn = document.getElementById('themeBtn');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const formatSelect = document.getElementById('formatSelect');
        const densitySelect = document.getElementById('densitySelect');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        
        const detailModal = document.getElementById('detailModal');
        const modalClose = document.getElementById('modalClose');
        const modalPreview = document.getElementById('modalPreview');
        const modalName = document.getElementById('modalName');
        const modalInfo = document.getElementById('modalInfo');

        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text).then(() => showToast(message)).catch(() => showToast("复制失败"));
        }

        // 📥 二进制/纯文本文件直接下载逻辑
        function downloadIcon(name, format, code) {
            const blob = format === 'svg' 
                ? new Blob([code], { type: 'image/svg+xml' })
                : (() => {
                    const base64Data = code.match(/base64,([^\"]+)/)[1];
                    const byteCharacters = atob(base64Data);
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
                    return new Blob([new Uint8Array(byteNumbers)], { type: 'image/png' });
                  })();

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.${format}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`已开始下载: ${name}.${format}`);
        }

        function renderGrid() {
            iconGrid.innerHTML = '';
            let filtered = MOCK_ICONS.filter(icon => {
                return (formatSelect.value === 'all' || icon.format === formatSelect.value) &&
                       icon.name.toLowerCase().includes(searchInput.value.toLowerCase());
            });

            filtered.sort((a, b) => sortSelect.value === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
            const visibleIcons = filtered.slice(0, displayLimit);
            loadMoreBtn.style.display = visibleIcons.length >= filtered.length ? 'none' : 'inline-block';

            if (visibleIcons.length === 0) {
                iconGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">暂无匹配的图标</div>`;
                return;
            }

            visibleIcons.forEach(icon => {
                const card = document.createElement('div');
                card.className = 'icon-card';
                card.style.color = icon.color;
                
                card.innerHTML = `
                    <span class="format-badge">${icon.format}</span>
                    <div class="icon-wrapper" title="点击复制源码">${icon.code}</div>
                    <div class="icon-name" style="color:var(--text-color);">${icon.name}</div>
                    <div class="icon-color" title="点击复制颜色值">${icon.color}</div>
                    <div class="card-actions">
                        <button class="action-btn view-btn" title="放大镜查看详情">
                            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        </button>
                        <button class="action-btn down-btn" title="下载图标">
                            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                        </button>
                    </div>
                `;

                card.querySelector('.icon-wrapper').addEventListener('click', () => {
                    if (icon.format === 'svg') copyToClipboard(icon.code, `已复制 SVG 代码: ${icon.name}`);
                    else copyToClipboard(icon.name, `已复制图标名称: ${icon.name}`);
                });
                
                card.querySelector('.icon-color').addEventListener('click', (e) => {
                    e.stopPropagation();
                    copyToClipboard(icon.color, `已复制颜色值: ${icon.color}`);
                });

                // 🔍 放大镜弹窗事件（苹果风过渡）
                card.querySelector('.view-btn').addEventListener('click', () => {
                    modalPreview.innerHTML = icon.code;
                    modalPreview.style.color = icon.color;
                    modalName.innerText = icon.name;
                    modalInfo.innerHTML = `格式: <b style="text-transform:uppercase;">${icon.format}</b><br>核心色值: <b>${icon.color}</b><br><span style="font-size:0.8rem;opacity:0.7;">NPC-icons 专属视觉设计资产</span>`;
                    detailModal.classList.add('active');
                });

                // 📥 下载事件绑定
                card.querySelector('.down-btn').addEventListener('click', () => {
                    downloadIcon(icon.name, icon.format, icon.code);
                });

                iconGrid.appendChild(card);
            });
        }

        modalClose.addEventListener('click', () => detailModal.classList.remove('active'));
        detailModal.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('active'); });

        toggleMenuBtn.addEventListener('click', () => sidebarMenu.classList.toggle('active'));
        document.addEventListener('click', (e) => { if(!sidebarMenu.contains(e.target) && e.target !== toggleMenuBtn) sidebarMenu.classList.remove('active'); });
        searchInput.addEventListener('input', () => { displayLimit = 12; renderGrid(); });
        sortSelect.addEventListener('change', renderGrid);
        formatSelect.addEventListener('change', () => { displayLimit = 12; renderGrid(); });
        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeBtn.innerText = isLight ? "切换到白天模式" : "切换到黑夜模式";
        });
        densitySelect.addEventListener('change', () => densitySelect.value === 'dense' ? iconGrid.classList.add('dense') : iconGrid.classList.remove('dense'));
        loadMoreBtn.addEventListener('click', () => { displayLimit += 12; renderGrid(); });

        renderGrid();
    </script>
</body>
</html>
