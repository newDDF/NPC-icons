<html lang="zh-CN" data-theme="light">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NPC-icons 图标库</title>
    <link rel="icon" href="https://newddf.xyz/favicon.ico" type="image/x-icon">
    <!-- 🌟 浏览器标签栏图标动态注入锚点（会自动替换为你的 my_logo） -->
    <link id="favicon" rel="icon" href="">
    <style>
        :root[data-theme="light"] {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-color: #1c1c1e;
            --text-muted: #8e8e93;
            --border-color: rgba(60, 60, 67, 0.1);
            --accent-color: #007aff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.04);
            --blur-bg: rgba(255, 255, 255, 0.7);
        }
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.8);
            --text-color: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: rgba(242, 242, 247, 0.15);
            --accent-color: #0a84ff;
            --shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            --blur-bg: rgba(28, 28, 30, 0.7);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s, border-color 0.3s; }
        body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", sans-serif; background-color: var(--bg-color); color: var(--text-color); padding-bottom: 60px; -webkit-font-smoothing: antialiased; }
        
        /* 🌟 全新设计的 Apple 风双端对齐 Header */
        .brand-header { max-width: 1200px; margin: 0 auto; padding: 40px 20px 20px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-logo-container { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: var(--text-color); }
        .header-logo-container svg, .header-logo-container img { width: 100%; height: 100%; object-fit: contain; }
        .header-titles { display: flex; flex-direction: column; }
        .header-titles h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
        .header-counter { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
        
        .header-right { display: flex; gap: 16px; align-items: center; }
        .nav-icon-link { color: var(--text-color); opacity: 0.7; transition: opacity 0.2s, transform 0.2s; display: flex; align-items: center; justify-content: center; }
        .nav-icon-link:hover { opacity: 1; transform: scale(1.05); }
        .nav-icon-link svg { width: 24px; height: 24px; fill: currentColor; }

        /* 工具栏纯图标化设计 */
        .toolbar { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 12px; align-items: center; position: relative; }
        .sidebar-toggle { background: var(--card-bg); border: 1px solid var(--border-color); width: 46px; height: 46px; border-radius: 12px; cursor: pointer; color: var(--text-color); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
        .sidebar-toggle svg { width: 20px; height: 20px; fill: currentColor; }
        
        .sidebar { position: absolute; top: 52px; left: 20px; background: var(--blur-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; display: none; flex-direction: column; gap: 15px; z-index: 100; box-shadow: var(--shadow); min-width: 220px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        .sidebar.active { display: flex; }
        .menu-item { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 500; }
        .menu-item select, .menu-item button { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.1); color: var(--text-color); cursor: pointer; font-size: 0.85rem; }

        /* 英文提示搜索框 */
        .search-box { flex: 1; }
        .search-box input { width: 100%; padding: 12px 20px; height: 46px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 0.95rem; outline: none; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
        .search-box input:focus { border-color: var(--accent-color); }

        .main-container { max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        
        /* 🌟 严格等高控制：彻底解决由于文本长短和PNG没有颜色值产生的错位问题 */
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 24px; align-items: stretch; }
        .icon-grid.dense { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 14px; }
        
        /* 使用 Flex 布局垂直平分空间，并限制最小高度 */
        .icon-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 20px; padding: 22px 16px 16px 16px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; min-height: 225px; box-shadow: var(--shadow); position: relative; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s; }
        .icon-card:hover { transform: translateY(-4px); box-shadow: 0 12px 30px rgba(0,0,0,0.08); }
        
        /* 紧凑模式下的等高线锁定 */
        .icon-grid.dense .icon-card { min-height: 185px; padding: 14px 10px; }

        .format-badge { position: absolute; top: 10px; right: 12px; font-size: 0.65rem; opacity: 0.4; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; }
        
        /* 图标 1/2 尺寸锁定 */
        .icon-wrapper { width: 80px; height: 80px; display: flex; justify-content: center; align-items: center; cursor: pointer; border-radius: 14px; }
        .icon-grid.dense .icon-wrapper { width: 64px; height: 64px; }
        .icon-wrapper svg, .icon-wrapper img { width: 100%; height: 100%; object-fit: contain; }
        
        /* 🌟 超长文本裁剪：防止超长字符拉伸或撑开容器 */
        .icon-name { font-weight: 600; font-size: 0.95rem; text-align: center; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 6px; }
        
        /* 颜色标签固定高度，防止 PNG 因没有此项导致排版高度塌陷 */
        .color-slot-wrapper { height: 22px; display: flex; align-items: center; justify-content: center; width: 100%; }
        .icon-color { font-size: 0.72rem; color: var(--text-muted); cursor: pointer; padding: 2px 8px; border-radius: 6px; background: rgba(0,0,0,0.03); font-family: monospace; }
        [data-theme="dark"] .icon-color { background: rgba(255,255,255,0.05); }

        .card-actions { display: flex; gap: 14px; width: 100%; justify-content: center; margin-top: 8px; border-top: 1px solid var(--border-color); padding-top: 10px; }
        .action-btn { background: none; border: none; cursor: pointer; color: var(--text-muted); display: flex; align-items: center; justify-content: center; padding: 6px; border-radius: 8px; }
        .action-btn:hover { color: var(--accent-color); background: rgba(0, 74, 255, 0.08); }
        .action-btn svg { width: 18px; height: 18px; fill: currentColor; }

        /* 全屏放大镜模态弹窗与可点击 Source 样式 */
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.4); z-index: 1000; display: flex; justify-content: center; align-items: center; opacity: 0; pointer-events: none; transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content { background: var(--blur-bg); border: 1px solid var(--border-color); width: 90%; max-width: 420px; border-radius: 28px; padding: 35px 30px; box-shadow: 0 20px 50px rgba(0,0,0,0.2); transform: scale(0.85) translateY(20px); transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); display: flex; flex-direction: column; align-items: center; gap: 16px; position: relative; }
        .modal-overlay.active .modal-content { transform: scale(1) translateY(0); }
        
        .modal-close { position: absolute; top: 16px; right: 16px; background: rgba(0,0,0,0.05); border: none; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; color: var(--text-color); font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .modal-preview { width: 120px; height: 120px; display: flex; align-items: center; justify-content: center; }
        .modal-preview svg, .modal-preview img { width: 100%; height: 100%; }
        
        /* 🌟 Source 链接高亮及新标签页图标 */
        .modal-source-link { color: var(--accent-color); text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
        .modal-source-link:hover { text-decoration: underline; }

        .load-more-container { text-align: center; margin: 50px 0; }
        .load-more-btn { background: var(--card-bg); border: 1px solid var(--border-color); padding: 14px 40px; border-radius: 25px; cursor: pointer; color: var(--text-color); font-size: 0.95rem; font-weight: 600; box-shadow: var(--shadow); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); }

        .toast { position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(100px); background: rgba(0,0,0,0.8); color: #fff; padding: 12px 24px; border-radius: 14px; font-size: 0.9rem; font-weight: 500; z-index: 2000; opacity: 0; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
        .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
        footer { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 0.85rem; font-weight: 500; border-top: 1px solid var(--border-color); margin-top: 60px; }
    </style>
</head>

        let displayLimit = 12;
        const iconGrid = document.getElementById('iconGrid');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const toggleMenuBtn = document.getElementById('toggleMenu');
        const toast = document.getElementById('toast');
        const themeBtn = document.getElementById('themeBtn');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const formatSelect = document.getElementById('formatSelect');
        const densitySelect = document.getElementById('densitySelect');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        
        const detailModal = document.getElementById('detailModal');
        const modalClose = document.getElementById('modalClose');
        const modalPreview = document.getElementById('modalPreview');
        const modalName = document.getElementById('modalName');
        const modalInfo = document.getElementById('modalInfo');

        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text).then(() => showToast(message)).catch(() => showToast("Copy failed"));
        }

        // 📥 流式直接下载
        function downloadIcon(name, format, code) {
            const blob = format === 'svg' 
                ? new Blob([code], { type: 'image/svg+xml' })
                : (() => {
                    const base64Data = code.match(/base64,([^\"]+)/);
                    const byteCharacters = atob(base64Data ? base64Data[1] : '');
                    const byteNumbers = new Array(byteCharacters.length);
                    for (let i = 0; i < byteCharacters.length; i++) byteNumbers[i] = byteCharacters.charCodeAt(i);
                    return new Blob([new Uint8Array(byteNumbers)], { type: 'image/png' });
                  })();

            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${name}.${format}`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            showToast(`Download started: ${name}.${format}`);
        }

        // 🌟 强力上色处理器引擎：直接穿透多层 SVG 形状强行洗色
        function applySvgColor(svgElement, color) {
            if (!svgElement || !color) return;
            svgElement.style.color = color;
            const allShapes = svgElement.querySelectorAll('path, circle, rect, polygon, ellipse, line, polyline');
            allShapes.forEach(shape => {
                if (shape.getAttribute('fill') !== 'none') {
                    shape.setAttribute('fill', color);
                }
                if (shape.hasAttribute('stroke') && shape.getAttribute('stroke') !== 'none') {
                    shape.setAttribute('stroke', color);
                }
            });
        }
        // 🔍 核心网格等高渲染
        function renderGrid() {
            iconGrid.innerHTML = '';
            
            let filtered = MOCK_ICONS.filter(icon => {
                const matchesSearch = icon.name.toLowerCase().includes(searchInput.value.toLowerCase().trim());
                const matchesFormat = formatSelect.value === 'all' || icon.format === formatSelect.value;
                return matchesSearch && matchesFormat;
            });

            filtered.sort((a, b) => sortSelect.value === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
            const visibleIcons = filtered.slice(0, displayLimit);
            loadMoreBtn.style.display = visibleIcons.length >= filtered.length ? 'none' : 'inline-block';

            if (visibleIcons.length === 0) {
                iconGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No matching icons found</div>`;
                return;
            }

            visibleIcons.forEach(icon => {
                const card = document.createElement('div');
                
                if (icon.format === 'svg') {
                    card.className = 'icon-card';
                    card.style.color = icon.color; 
                } else {
                    card.className = 'icon-card no-color-card';
                    card.style.color = 'var(--text-color)';
                }
                
                const colorDisplay = icon.format === 'svg' 
                    ? `<div class="icon-color" title="Click to copy color">${icon.color}</div>` 
                    : '';

                card.innerHTML = `
                    <span class="format-badge">${icon.format}</span>
                    <div class="icon-wrapper" title="Click to copy asset">${icon.code}</div>
                    <div class="icon-name" style="color:var(--text-color);" title="${icon.name}">${icon.name}</div>
                    <div class="color-slot-wrapper">${colorDisplay}</div>
                    <div class="card-actions">
                        <button class="action-btn view-btn" title="Inspect Detail">
                            <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                        </button>
                        <button class="action-btn down-btn" title="Download Asset">
                            <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                        </button>
                    </div>
                `;

                // 注入后瞬间激活强力变色引擎
                if (icon.format === 'svg') {
                    const embeddedSvg = card.querySelector('.icon-wrapper svg');
                    applySvgColor(embeddedSvg, icon.color);
                }

                card.querySelector('.icon-wrapper').addEventListener('click', () => {
                    const currentSvg = card.querySelector('.icon-wrapper').innerHTML;
                    if (icon.format === 'svg') copyToClipboard(currentSvg, `Copied SVG code!`);
                    else copyToClipboard(icon.name, `Copied icon name: ${icon.name}!`);
                });
                
                if (icon.format === 'svg') {
                    card.querySelector('.icon-color').addEventListener('click', (e) => {
                        e.stopPropagation();
                        copyToClipboard(icon.color, `Copied color value: ${icon.color}!`);
                    });
                }

                // 🔍 详情弹窗解析
                card.querySelector('.view-btn').addEventListener('click', () => {
                    const currentSvg = card.querySelector('.icon-wrapper').innerHTML;
                    modalPreview.innerHTML = currentSvg;
                    modalPreview.style.color = icon.color;
                    modalName.innerText = icon.name;
                    
                    const sourceHtml = icon.source 
                        ? `<a class="modal-source-link" href="${icon.source}" target="_blank">Official Website <svg style="width:14px;height:14px;fill:currentColor;" viewBox="0 0 24 24"><path d="M14 3h7v7h-2V6.41l-9.29 9.3-1.42-1.42L17.59 5H14V3zM5 5h6V3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2v-6h-2v6H5V5z"/></svg></a>` 
                        : `<span style="color:var(--text-muted); font-size:0.9rem;">None</span>`;

                    modalInfo.innerHTML = `
                        Format: <b style="text-transform:uppercase; color:var(--accent-color);">${icon.format}</b><br>
                        ${icon.format === 'svg' ? 'Hex Color: <b style="font-family:monospace;">' + icon.color + '</b><br>' : ''}
                        Source: ${sourceHtml}<br><br>
                        <div style="text-align:left; background:rgba(0,0,0,0.03); padding:14px; border-radius:14px; font-size:0.88rem; border:1px solid var(--border-color); color:var(--text-muted); font-weight:500; max-height:120px; overflow-y:auto; line-height:1.5;">
                            ${icon.info}
                        </div>
                    `;
                    detailModal.classList.add('active');
                });

                card.querySelector('.down-btn').addEventListener('click', () => {
                    const currentSvg = card.querySelector('.icon-wrapper').innerHTML;
                    downloadIcon(icon.name, icon.format, currentSvg);
                });

                iconGrid.appendChild(card);
            });
            
            // Header 的 my_logo 变色同步
            const headerLogoSvg = document.querySelector('.header-logo-container svg');
            const logoAsset = MOCK_ICONS.find(i => i.name === 'my_logo');
            if (headerLogoSvg && logoAsset) {
                applySvgColor(headerLogoSvg, logoAsset.color || 'var(--text-color)');
            }
        }

        modalClose.addEventListener('click', () => detailModal.classList.remove('active'));
        detailModal.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('active'); });
        toggleMenuBtn.addEventListener('click', () => sidebarMenu.classList.toggle('active'));
        document.addEventListener('click', (e) => { if(!sidebarMenu.contains(e.target) && e.target !== toggleMenuBtn) sidebarMenu.classList.remove('active'); });
        
        searchInput.addEventListener('input', () => { displayLimit = 12; renderGrid(); });
        sortSelect.addEventListener('change', renderGrid);
        formatSelect.addEventListener('change', () => { displayLimit = 12; renderGrid(); });
        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeBtn.innerText = isLight ? "Light Mode" : "Dark Mode";
        });
        densitySelect.addEventListener('change', () => densitySelect.value === 'dense' ? iconGrid.classList.add('dense') : iconGrid.classList.remove('dense'));
        loadMoreBtn.addEventListener('click', () => { displayLimit += 12; renderGrid(); });

        renderGrid();
    </script>
</body>
</html>
