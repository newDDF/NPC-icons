name: Build and Deploy Icon Site

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: npc-icons-main-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run isolated smoke tests
        run: npm run build:smoke

      - name: Build site
        run: npm run build

      - name: Persist generated ID registries
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/id-registry.json data/legacy-id-map.json

          if git diff --cached --quiet; then
            echo "No registry changes to persist."
            exit 0
          fi

          git commit -m "chore: register new icon IDs"
          git push origin HEAD:main

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
