        :root[data-theme="light"] {
            --bg-color: #f2f2f7;
            --card-bg: rgba(255, 255, 255, 0.8);
            --text-color: #1c1c1e;
            --text-muted: #8e8e93;
            --border-color: rgba(60, 60, 67, 0.1);
            --accent-color: #007aff;
            --shadow: 0 4px 12px rgba(0, 0, 0, 0.03), 0 1px 2px rgba(0, 0, 0, 0.02);
            --hover-shadow: 0 22px 40px rgba(0, 0, 0, 0.1), 0 12px 16px rgba(0, 0, 0, 0.04);
            --blur-bg: rgba(255, 255, 255, 0.7);
            --card-border-radius: 16px;
            --wrapper-bg: #f2f2f7; 
        }
        :root[data-theme="dark"] {
            --bg-color: #000000;
            --card-bg: rgba(28, 28, 30, 0.8);
            --text-color: #f2f2f7;
            --text-muted: #8e8e93;
            --border-color: rgba(242, 242, 247, 0.15);
            --accent-color: #0a84ff;
            --shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
            --hover-shadow: 0 24px 48px rgba(0, 0, 0, 0.65), 0 14px 22px rgba(0, 0, 0, 0.35);
            --blur-bg: rgba(28, 28, 30, 0.7);
            --card-border-radius: 16px;
            --wrapper-bg: #ffffff; 
        }

        .brand-header { max-width: 1200px; margin: 0 auto; padding: 40px 20px 20px 20px; display: flex; justify-content: space-between; align-items: center; }
        .header-left { display: flex; align-items: center; gap: 14px; }
        .header-logo-container { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; }
        .header-logo-container svg, .header-logo-container img { width: 100%; height: 100%; object-fit: contain; }
        .header-titles { display: flex; flex-direction: column; }
        .header-titles h1 { font-size: 1.8rem; font-weight: 700; letter-spacing: -0.5px; line-height: 1.2; }
        .header-counter { font-size: 0.8rem; color: var(--text-muted); font-weight: 500; margin-top: 2px; }
        .header-right { display: flex; gap: 18px; align-items: center; }
        .nav-icon-link { color: var(--text-color); opacity: 0.7; transition: opacity 0.2s; display: flex; align-items: center; justify-content: center; }
        .nav-icon-link:hover { opacity: 1; }
        .nav-icon-link svg { width: 24px; height: 24px; fill: currentColor; }

        .toolbar { max-width: 1200px; margin: 0 auto; padding: 0 20px; display: flex; gap: 12px; align-items: center; position: relative; z-index: 100; }
        .sidebar-toggle { background: var(--card-bg); border: 1px solid var(--border-color); width: 48px; height: 48px; border-radius: 12px; cursor: pointer; color: var(--text-color); display: flex; align-items: center; justify-content: center; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); padding: 0; outline: none; }
        .sidebar-toggle svg { width: 22px; height: 22px; fill: currentColor; pointer-events: none; }
        
        .sidebar { position: absolute; top: 56px; left: 20px; background: var(--blur-bg); border: 1px solid var(--border-color); border-radius: 16px; padding: 18px; display: none; flex-direction: column; gap: 15px; z-index: 150; box-shadow: var(--shadow); min-width: 220px; backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px); }
        .sidebar.active { display: flex; }
        .menu-item { display: flex; flex-direction: column; gap: 6px; font-size: 0.85rem; font-weight: 500; }
        .menu-item select, .menu-item button { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border-color); background: rgba(255,255,255,0.1); color: var(--text-color); cursor: pointer; font-size: 0.85rem; }

        .search-box { flex: 1; }
        .search-box input { width: 100%; padding: 12px 20px; height: 48px; border-radius: 12px; border: 1px solid var(--border-color); background: var(--card-bg); color: var(--text-color); font-size: 0.95rem; outline: none; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); box-shadow: var(--shadow); }
        .search-box input:focus { border-color: var(--accent-color); }

        /* 馃専 1. 杈圭紭闃茶鍓殧绂伙細鎵╁睍 main 瀹瑰櫒鐨勫唴杈硅窛锛屽苟寮哄埗瑙ｉ櫎浠讳綍鐗╃悊鎴柇闄愬埗 */
        .main-container { max-width: 1200px; margin: 30px auto; padding: 15px 32px 40px 32px; overflow: visible !important; }
        
        /* 馃専 2. 缃戞牸鐪熺┖灞傦細纭繚 Grid 杞ㄩ亾鏈韩涓嶉檺鍒跺瓙椤圭殑婧㈠嚭鏀惧ぇ鏁堟灉 */
        .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 28px; align-items: stretch; overflow: visible !important; }
        .icon-grid.dense { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 18px; }

        /* 馃専 3. 鎷熺墿鎮诞澶ф彁閫燂細寮曞叆 scale(1) 鍒濆闃诲凹锛寊-index 璁句负鍩虹灞?*/
        .icon-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: var(--card-border-radius); display: flex; flex-direction: column; justify-content: space-between; min-height: 250px; box-shadow: var(--shadow); position: relative; backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); overflow: visible !important; padding: 0 !important; z-index: 10; transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s cubic-bezier(0.16, 1, 0.3, 1), border-color 0.3s; }
        
        /* 馃専 4. 缁堟瀬鍚堜綋鍔ㄦ晥锛氬悜涓婁綅绉?6px 鐨勫悓鏃舵墽琛岀簿鍑嗙殑銆愮瓑姣旀斁澶?10% (scale(1.1))銆戯紝骞朵笖灞傜骇寮鸿鎷旈珮鍒?z-index: 50 娴┖锛岄厤鍚堝灞傛孩鍑哄彲瑙侊紝纭繚璐磋繎杈规鏃?100% 瀹屾暣灞曠幇 */
        .icon-card:hover { transform: translateY(-6px) scale(1.1); box-shadow: var(--hover-shadow); border-color: rgba(0, 0, 0, 0.15); z-index: 50; }
        [data-theme="dark"] .icon-card:hover { border-color: var(--accent-color); }

        .icon-grid.dense .icon-card { min-height: 205px; }
        .format-badge { position: absolute; top: 16px; right: 14px; font-size: 0.65rem; opacity: 0.4; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; pointer-events: none; z-index: 5; }
        
        /* 鍍忕礌绾у绉板簳琛?*/
        .icon-wrapper { width: 100%; height: 130px; display: flex; justify-content: center; align-items: center; cursor: pointer; padding: 22px; background: var(--wrapper-bg); border: 12px solid transparent; background-clip: padding-box; border-radius: 22px; overflow: hidden; }
        .icon-grid.dense .icon-wrapper { height: 105px; padding: 16px; border: 8px solid transparent; background-clip: padding-box; border-radius: 16px; }
        .icon-wrapper svg, .icon-wrapper img { width: 80px; height: 80px; object-fit: contain; max-width: 100%; max-height: 100%; }
        .icon-grid.dense .icon-wrapper svg, .icon-grid.dense .icon-wrapper img { width: 64px; height: 64px; }
        
        .icon-name { font-weight: 600; font-size: 1.15rem; text-align: left; width: 100%; padding: 0 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 12px; margin-top: 6px; }
        .icon-grid.dense .icon-name { padding: 0 10px; font-size: 0.95rem; margin-bottom: 8px; margin-top: 4px; }

        /* 鍗＄墖璐┛鏍忓簳锛堝姞鍏ュ渾瑙掕鍓慨姝ｏ紝闃叉鏀惧ぇ鏃跺簳閮ㄨ竟缂樻孩鍑哄皷瑙掞級 */
        .card-bottom-bar { display: flex; width: 100%; height: 42px; border-top: 1px solid var(--border-color); background: rgba(0,0,0,0.01); border-bottom-left-radius: var(--card-border-radius); border-bottom-right-radius: var(--card-border-radius); overflow: hidden; }
        .icon-grid.dense .card-bottom-bar { height: 36px; }
        
        .color-block-btn { flex: 1.3; height: 100%; display: flex; align-items: center; justify-content: center; font-size: 0.78rem; font-weight: 700; cursor: pointer; font-family: monospace; letter-spacing: 0.2px; padding: 0 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .color-block-btn.no-color { background: rgba(0,0,0,0.04) !important; color: var(--text-muted); text-shadow: none; font-weight: 600; cursor: default; }
        [data-theme="dark"] .color-block-btn.no-color { background: rgba(255,255,255,0.04) !important; }

        .action-btn-zone { flex: 1.7; height: 100%; display: flex; border-left: 1px solid var(--border-color); }
        .action-btn { flex: 1; height: 100%; background: none; border: none; cursor: pointer; color: var(--text-color); opacity: 0.75; display: flex; align-items: center; justify-content: center; transition: background-color 0.2s, opacity 0.2s; }
        .action-btn:hover { opacity: 1; background: rgba(0, 0, 0, 0.03); }
        [data-theme="dark"] .action-btn:hover { background: rgba(255, 255, 255, 0.05); }
        .action-btn:first-child { border-right: 1px solid var(--border-color); }
        .action-btn svg { width: 17px; height: 18px; fill: currentColor; }
        .icon-grid.dense .action-btn svg { width: 15px; height: 16px; }

    <div class="toolbar">
        <button class="sidebar-toggle" id="toggleMenu" title="Menu Settings"><svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg></button>
        <div class="sidebar" id="sidebarMenu">
            <div class="menu-item"><label>Sort Order</label><select id="sortSelect"><option value="asc">A-Z (Ascending)</option><option value="desc">Z-A (Descending)</option></select></div>
            <div class="menu-item"><label>Theme Mode</label><button id="themeBtn">Switch Mode</button></div>
            <div class="menu-item"><label>Filter Format</label><select id="formatSelect"><option value="all">All Formats</option><option value="svg">Only SVG</option><option value="png">Only PNG</option></select></div>
            <div class="menu-item"><label>Display Density</label><select id="densitySelect"><option value="normal">Comfortable</option><option value="dense">Compact</option></select></div>
        </div>
        <div class="search-box"><input type="text" id="searchInput" placeholder="Search icons..."></div>
    </div>

    <main class="main-container">
        <div class="icon-grid" id="iconGrid"></div>
        <div class="load-more-container"><button class="load-more-btn" id="loadMoreBtn">Show More</button></div>
    </main>

    <div class="modal-overlay" id="detailModal">
        <div class="modal-content">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-preview" id="modalPreview"></div>
            <h3 id="modalName" style="font-size:1.4rem; font-weight:700; margin:5px 0 0;"></h3>
            <p id="modalInfo" style="font-size:0.95rem; color:var(--text-color); text-align:center; line-height:1.6; width:100%; max-width:420px; margin:0; word-break:break-word;"></p>
        </div>
    </div>

    <div class="toast" id="toast">Copied to clipboard!</div>
    <footer>Copyright@NPC2026</footer>









      <script>
        // 馃憞 鑷姩鍖栨瀯寤鸿剼鏈湪鎵撳寘鏃讹紝浼氳嚜鍔ㄥ線姝ゅ崰浣嶇鍖哄煙鍔ㄦ€佹敞鍏ユ寮忔暟鎹竻鍗?
        /*[[BUILD_INSERT_ICONS]]*/
let MOCK_ICONS = [];
/*[[BUILD_INSERT_END]]*/

        let displayLimit = 12;
        const iconGrid = document.getElementById('iconGrid');
        const sidebarMenu = document.getElementById('sidebarMenu');
        const toggleMenuBtn = document.getElementById('toggleMenu');
        const toast = document.getElementById('toast');
        const themeBtn = document.getElementById('themeBtn');
        const searchInput = document.getElementById('searchInput');
        const sortSelect = document.getElementById('sortSelect');
        const formatSelect = document.getElementById('formatSelect');
        const densitySelect = document.getElementById('densitySelect');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        
        const detailModal = document.getElementById('detailModal');
        const modalClose = document.getElementById('modalClose');
        const modalPreview = document.getElementById('modalPreview');
        const modalName = document.getElementById('modalName');
        const modalInfo = document.getElementById('modalInfo');

        function showToast(message) {
            toast.innerText = message;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        function copyToClipboard(text, message) {
            navigator.clipboard.writeText(text).then(() => showToast(message)).catch(() => showToast("Copy failed"));
        }

        async function downloadIcon(name, format, path) {
            try {
                const response = await fetch(path);
                if (!response.ok) throw new Error("Download failed");

                const blob = await response.blob();
                const url = URL.createObjectURL(blob);
                const a = document.createElement("a");
                a.href = url;
                a.download = `${name}.${format}`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
                showToast(`Download started: ${name}.${format}`);
            } catch (error) {
                console.error(error);
                showToast("Download failed");
            }
        }
        function getContrastTextColor(hexColor) {
            const cleanHex = hexColor.replace('#', '').trim();
            if (cleanHex.length === 3) {
                const r = parseInt(cleanHex.substr(0,1)+cleanHex.substr(0,1), 16);
                const g = parseInt(cleanHex.substr(1,1)+cleanHex.substr(1,1), 16);
                const b = parseInt(cleanHex.substr(2,1)+cleanHex.substr(2,1), 16);
                return (r * 0.299 + g * 0.587 + b * 0.114) > 186 ? '#1c1c1e' : '#ffffff';
            } else if (cleanHex.length === 6) {
                const r = parseInt(cleanHex.substr(0, 2), 16);
                const g = parseInt(cleanHex.substr(2, 2), 16);
                const b = parseInt(cleanHex.substr(4, 2), 16);
                return (r * 0.299 + g * 0.587 + b * 0.114) > 186 ? '#1c1c1e' : '#ffffff';
            }
            return '#ffffff';
        }






        // 馃攳 鏍稿績绛夐珮娓叉煋鍙婂叏鏍煎紡妯＄硦鍖归厤
        function renderGrid() {
            iconGrid.innerHTML = '';
            
            let filtered = MOCK_ICONS.filter(icon => {
                const matchesSearch = icon.name.toLowerCase().includes(searchInput.value.toLowerCase().trim());
                const matchesFormat = formatSelect.value === 'all' || icon.format === formatSelect.value;
                return matchesSearch && matchesFormat;
            });

            filtered.sort((a, b) => sortSelect.value === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name));
            const visibleIcons = filtered.slice(0, displayLimit);
            loadMoreBtn.style.display = visibleIcons.length >= filtered.length ? 'none' : 'inline-block';

            if (visibleIcons.length === 0) {
                iconGrid.innerHTML = `<div style="grid-column:1/-1;text-align:center;color:var(--text-muted);padding:40px;">No matching icons found</div>`;
                return;
            }

            visibleIcons.forEach(icon => {
                const card = document.createElement('div');
                
                let displayColor = icon.color && !icon.color.startsWith('#') && icon.color !== 'none' ? `#${icon.color}` : icon.color;
                if (!displayColor || displayColor === 'none') displayColor = '#000000';

                card.className = icon.format === 'svg' ? 'icon-card' : 'icon-card no-color-card';

                // 鑾峰彇鑷€傚簲鍓嶆櫙鑹诧紝瀹岀編瑙ｅ喅绾粦鑹插潡瀛椾綋鐪嬩笉娓呯殑闂
                const textColor = getContrastTextColor(displayColor);

                const bottomBarHtml = icon.format === 'svg'
                    ? `<div class="color-block-btn" style="background:${displayColor}; color:${textColor};" title="Click to copy Hex">${displayColor}</div>`
                    : `<div class="color-block-btn no-color">PNG</div>`;

                card.innerHTML = `
                    <span class="format-badge">${icon.format}</span>
                    <div class="icon-wrapper" title="Click to copy asset code"><img src="${icon.path}" alt="${icon.name}" style="width:100%;height:100%;object-fit:contain;"></div>
                    <div class="icon-name" style="color:var(--text-color);">${icon.name}</div>
                    <div class="card-bottom-bar">
                        ${bottomBarHtml}
                        <div class="action-btn-zone">
                            <button class="action-btn view-btn" title="Inspect Detail">
                                <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                            </button>
                            <button class="action-btn down-btn" title="Download Asset">
                                <svg viewBox="0 0 24 24"><path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/></svg>
                            </button>
                        </div>
                    </div>
                `;

                card.querySelector('.icon-wrapper').addEventListener('click', async () => {
                    if (icon.format === 'svg') {
                        try {
                            const response = await fetch(icon.path);
                            if (!response.ok) throw new Error('Failed to load SVG');

                            const svgCode = await response.text();
                            copyToClipboard(svgCode, `Copied SVG code of ${icon.name}!`);
                        } catch (error) {
                            console.error(error);
                            showToast('Copy failed');
                        }
                    } else {
                        copyToClipboard(icon.name, `Copied icon name: ${icon.name}!`);
                    }
                });
                    card.querySelector('.color-block-btn').addEventListener('click', () => {
                        copyToClipboard(displayColor, `Copied color value: ${displayColor}!`);
                    });
                card.querySelector('.view-btn').addEventListener('click', () => {
                    modalPreview.innerHTML = `<img src="${icon.path}" alt="${icon.name}">`;
                    modalName.innerText = icon.name;

                    const sourceHtml = icon.source
                        ? `<a class="modal-source-link" href="${icon.source}" target="_blank">Official Website</a>`
                        : `<span style="color:var(--text-muted); font-size:0.9rem;">None</span>`;

                    modalInfo.innerHTML = `
                        Format: <b style="text-transform:uppercase; color:var(--accent-color);">${icon.format}</b><br>
                        ${icon.format === 'svg' ? 'Hex Color: <b style="font-family:monospace;">' + displayColor + '</b><br>' : ''}
                        Source: ${sourceHtml}<br><br>
                        <div style="text-align:left; background:rgba(0,0,0,0.03); padding:14px; border-radius:14px; font-size:0.88rem; border:1px solid var(--border-color); color:var(--text-muted); font-weight:500; max-height:120px; overflow-y:auto; line-height:1.5;">
                            ${icon.info}
                        </div>
                    `;

                    detailModal.classList.add('active');
                });
                card.querySelector('.down-btn').addEventListener('click', () => {
                    downloadIcon(icon.name, icon.format, icon.path);
                });
                iconGrid.appendChild(card);
            });
        }
        modalClose.addEventListener('click', () => detailModal.classList.remove('active'));
        detailModal.addEventListener('click', (e) => { if (e.target === detailModal) detailModal.classList.remove('active'); });
        
        toggleMenuBtn.addEventListener('click', (e) => { e.stopPropagation(); sidebarMenu.classList.toggle('active'); });
        document.addEventListener('click', (e) => { if(!sidebarMenu.contains(e.target) && e.target !== toggleMenuBtn) sidebarMenu.classList.remove('active'); });
        
        searchInput.addEventListener('input', () => { displayLimit = 12; renderGrid(); });
        sortSelect.addEventListener('change', renderGrid);
        formatSelect.addEventListener('change', () => { displayLimit = 12; renderGrid(); });
        themeBtn.addEventListener('click', () => {
            const isLight = document.documentElement.getAttribute('data-theme') === 'light';
            document.documentElement.setAttribute('data-theme', isLight ? 'dark' : 'light');
            themeBtn.innerText = isLight ? "Light Mode" : "Dark Mode";
            renderGrid();
        });
        densitySelect.addEventListener('change', () => densitySelect.value === 'dense' ? iconGrid.classList.add('dense') : iconGrid.classList.remove('dense'));
        loadMoreBtn.addEventListener('click', () => { displayLimit += 12; renderGrid(); });

        fetch('./data/icons.json')
            .then(response => {
                if (!response.ok) throw new Error('Failed to load icons.json');
                return response.json();
            })
            .then(data => {
                MOCK_ICONS = data;
                renderGrid();
            })
            .catch(error => {
                console.error('Icon data loading failed:', error);
                iconGrid.innerHTML = '<div style="padding:40px;text-align:center;">Failed to load icon data.</div>';
            });
    </script>
</body>
</html>
